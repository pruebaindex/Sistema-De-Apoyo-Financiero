<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithRedirect, 
    getRedirectResult, 
    GoogleAuthProvider, 
    onAuthStateChanged,
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // Tus credenciales de Firebase
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "sistema-de-apoyo-financiero.firebaseapp.com",
    projectId: "sistema-de-apoyo-financiero",
    storageBucket: "sistema-de-apoyo-financiero.appspot.com",
    messagingSenderId: "TU_MESSAGING_SENDER_ID",
    appId: "TU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const btnLogin = document.getElementById('googleLoginBtn');
  const userStatusDiv = document.getElementById('userStatus');

  if (btnLogin) {
    btnLogin.addEventListener('click', (e) => {
      e.preventDefault();
      signInWithRedirect(auth, provider);
    });
  }

  getRedirectResult(auth)
    .then((result) => {
      if (result) {
        console.log("¡Bienvenido!", result.user.displayName);
      }
    })
    .catch((error) => {
      console.error("Error en la redirección:", error);
      alert("No se pudo iniciar sesión: " + error.message);
    });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      console.log("Usuario activo:", user.email);
      if (btnLogin) btnLogin.style.display = 'none';
      if (userStatusDiv) userStatusDiv.innerText = `Conectado como: ${user.displayName || user.email}`;
    } else {
      console.log("No hay usuario activo.");
      if (btnLogin) btnLogin.style.display = 'block';
      if (userStatusDiv) userStatusDiv.innerText = '';
    }
  });
</script>
